# QCY H3S + UGREEN Barrot 33fa:0012 — WirePlumber 0.5
# Música: A2DP/AAC. Mic: autoswitch → HFP CVSD 8 kHz.
#
# mSBC DESLIGADO DE PROPÓSITO (medido 25/09/2026, ver docs/KERNEL-BTUSB-BARROT.md):
# a negociação mSBC é perfeita no ar (eSCO, 60 bytes, air transparent, USB alt 3)
# mas o endpoint isocrono do Barrot em alt 3 entrega quadros de 25 bytes que
# nao remontam um frame de 72 bytes -> ~400 pacotes "corrupted SCO" por segundo
# e audio 100% mudo. Com msbc=true o BlueZ ainda ESCOLHE o perfil MSBC
# (prioridade 6 > 5 do CVSD) e o mic fica mudo sozinho.
# Nao religue sem o patch de hardware que ainda nao existe.

monitor.bluez.properties = {
  bluez5.enable-msbc = false
  bluez5.hfphsp-backend = "native"
  bluez5.hw-offload-sco = false
  bluez5.roles = [ a2dp_sink a2dp_source hsp_hs hsp_ag hfp_hf hfp_ag ]
}

wireplumber.settings = {
  bluetooth.use-persistent-storage = true
  bluetooth.autoswitch-to-headset-profile = true
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "bluez_card.84_AC_60_05_55_2C" }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink hfp_hf hsp_hs ]
        device.intended-roles = [ Communication ]
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_input.84:AC:60:05:55:2C" }
    ]
    actions = {
      update-props = {
        node.nick = "QCY H3S"
        node.description = "QCY H3S Microphone"
        node.pause-on-idle = false
        session.suspend-timeout-seconds = 0
        priority.session = 2500
        priority.driver = 2500
        object.register = true
        resample.quality = 10
        node.latency = "1024/48000"
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_capture_internal.84:AC:60:05:55:2C" }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = false
        session.suspend-timeout-seconds = 0
        resample.quality = 10
        node.latency = "1024/48000"
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_input.84_AC_60_05_55_2C.*" }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = false
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_output.*84_AC_60_05_55_2C.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 5
      }
    }
  }
]