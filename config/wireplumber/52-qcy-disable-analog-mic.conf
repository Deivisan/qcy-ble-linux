# Desabilita microfone analógico da placa-mãe — evita apps pegarem o mic errado.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_input.pci-0000_0a_00.6.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.disabled = true
        node.description = "Placa-mãe (desabilitado — usar QCY H3S)"
      }
    }
  }
]