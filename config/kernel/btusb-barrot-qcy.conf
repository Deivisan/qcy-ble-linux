# QCY H3S + UGREEN/Barrot 33fa:0012 — modulo btusb patcheado (0.8-barrot4)
#
# ==> O BTUSB PRECISA DESTE PATCH. Sem ele o microfone nao funciona. <==
#     Detalhe completo em docs/KERNEL-BTUSB-BARROT.md
#
# ---------------------------------------------------------------------------
# P3 (a correcao que importa): alt setting do endpoint isocronico
# ---------------------------------------------------------------------------
# O Barrot 33fa:0010/0012 NAO anuncia 2EV3 (hdev->voice_setting & 0x0020 == 0),
# entao btusb_work() caia no ramo `else`:
#       new_alts = data->sco_num;      -> altsetting 1 = 9 bytes
#
# Um pacote SCO CVSD tem 60 BYTES (8 kHz x 8 bits, 7,5 ms). Com 9 bytes por
# microframe a remontagem isocronica nao fecha, e o resultado e:
#   - ~400 "corrupted SCO packet"/s
#   - audio do microfone 100% mudo
#   - ... com o HCI reportando o link como PERFEITO:
#       "Synchronous Connect Complete ... Status: Success (0x00)"
#       ~600 pacotes SCO/s no ar, e NENHUMA mensagem de erro no kernel.
#
# Esse e o fingerprint do bug. O patch (P3 no btusb) forca o Barrot a usar a
# MESMA tabela e o MESMO indice que o upstream usa no caminho 2EV3:
#   static const int alts[3] = { 2, 4, 5 };   -> 1 conexao = altsetting 2 (17 B)
# Nao inventa nenhum numero; reaproveita o caminho validado pelo proprio
# commit do Barrot 7722d6fb54e4 (v6.18+), testado neste exato dispositivo.
#
# COMO CONFERIR: com o mic aberto, o altsetting tem que ser 2, nunca 1.
#   timeout 10 pw-record --target bluez_input.84_AC_60_05_55:2C /tmp/t.wav &
#   sleep 3; cat /sys/bus/usb/devices/1-5:1.1/bAlternateSetting
# (ajuste o caminho 1-5 ao seu barramento; veja `lsusb -t`)
#
# ---------------------------------------------------------------------------
# P2: SCO classico (0x0028) em vez de Enhanced (0x043d)
# ---------------------------------------------------------------------------
# HCI_QUIRK_BROKEN_ENHANCED_SETUP_SYNC_CONN no Barrot. Com ela ativa,
# hci_setup_sync() usa o comando classico Setup Synchronous Connection.
# Precedente identico: patch btmtk de mai/2026 para o MT6639 ("o firmware
# anuncia 0x043d mas rejeita em runtime... o driver do Windows contorna
# usando o comando classico 0x0428"). Mesmo padrao que o upstream ja usa
# em QCA e MediaTek. Como o mesmo par dongle+fone funciona no Windows,
# este e o caminho que o Windows usa.
#
# CONFIRMAR QUE A QUIRK ESTA ATIVA:
#   dmesg | grep "Enhanced Setup Synchronous"
#
# ---------------------------------------------------------------------------
# force_scofix=1
# ---------------------------------------------------------------------------
# Liga HCI_QUIRK_FIXUP_BUFFER_SIZE, que em hci_cc_read_buffer_size() forca
#   hdev->sco_mtu  = 64      (em vez do valor real do controlador)
#   hdev->sco_pkts = 8
# 64 bytes e exatamente o tamanho do pacote SCO CVSD, entao esta correto
# para o nosso caso. Tambem ativa o filtro de pacotes SCO duplicados
# ("Workaround for spotty SCO quality"), util nesta familia de dongles.
# Nao afeta o A2DP (que trafega por ACL, nao por SCO).
#
# ATENCAO: force_scofix TAMBEM bloqueia o caminho mSBC (alt 3 exige
# sco_mtu >= 72). Isso nao importa: mSBC e IMPOSSIVEL neste dongle porque
# ele nao tem alt 6 (teto = alt 5, 49 bytes) e o bit BTUSB_USE_ALT3_FOR_WBS
# so e setado para chips Realtek. Ver docs/KERNEL-BTUSB-BARROT.md secao 5.
# Nao religue bluez5.enable-msbc: o codec e negociado, o audio chega mudo.
#
# ---------------------------------------------------------------------------
# enable_autosuspend=0
# ---------------------------------------------------------------------------
# Evita suspender o dongle com link de audio ativo.
#
# ---------------------------------------------------------------------------
# VERIFICAR QUAL MODULO ESTA EM USO
# ---------------------------------------------------------------------------
#   cat /sys/module/btusb/version   ->  0.8-barrot4   (tem que ser este)
#   modinfo -n btusb                ->  .../updates/dkms/btusb.ko
#
# Se o version mostrar "0.8" (sem sufixo), o override NAO esta em uso e o
# microfone vai ficar mudo. Reinstale com:
#   ./scripts/apply-btusb-esco-count-fix.sh
options btusb force_scofix=1
options btusb enable_autosuspend=0
