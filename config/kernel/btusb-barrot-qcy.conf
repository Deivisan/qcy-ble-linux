# QCY H3S + UGREEN Barrot 33fa:0012 — modulo btusb patcheado (0.8-barrot1)
#
# force_scofix=1 -> liga HCI_QUIRK_FIXUP_BUFFER_SIZE ("Workaround for spotty SCO
# quality", upstream). Ela FAZ duas coisas neste dongle:
#   1) hci_read_buffer_size() passa a usar sco_mtu=64 / sco_pkts=8 em vez dos
#      valores reais do controlador (255/4). Isso era o que IMPEDIA o caminho
#      mSBC/alt-3, mas o mSBC provou ser inutil neste hardware (ver nota abaixo),
#      entao o efeito colateral nao importa mais e o filtro de pacote duplicado
#      volta a ser util.
#   2) filtra pacotes SCO duplicados/sporadicos do tipo "corrupted SCO packet".
#
# mSBC: NAO LIGAR bluez5.enable-msbc. Medido em 25/09/2026 com o patch 0.8-barrot1:
# a negociacao no ar e perfeita (eSCO 60B, air transparent, USB alt 3, dlen 72)
# mas o endpoint isocrono do Barrot em alt 3 entrega quadros de 25 bytes que
# nao remontam um frame de 72 bytes -> ~400 "corrupted SCO" por SEGUNDO e audio
# 100% mudo. Pior: com mSBC habilitado o BlueZ escolhe sozinho o perfil MSBC
# (prioridade 6 > 5 do CVSD) e o mic fica mudo sem o usuario pedir.
# Ver docs/KERNEL-BTUSB-BARROT.md e TENTATIVAS-SEM-SUCESSO.md item 15.
#
# Verificar modulo em uso: cat /sys/module/btusb/version  ->  0.8-barrot1
#                         modinfo -n btusb              ->  .../updates/dkms/btusb.ko
options btusb force_scofix=1
options btusb enable_autosuspend=0
